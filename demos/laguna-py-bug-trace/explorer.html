  .bar-row .v { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  table.mini { border-collapse: collapse; margin-top: 6px; font-size: 11.5px; }
  table.mini th, table.mini td { padding: 3px 8px; border-bottom: 1px solid var(--gridline); text-align: left; }

function familyOf(modelId) { return (modelId || "").split("/")[0] || "other"; }
const FAMILIES = [...new Set(BOARD.map((r) => familyOf(r.model_id)))].sort();
function cellDeep(modelId, level) { return DEEP ? DEEP.cells[modelId + "::" + level] : null; }
function anomalousModels() {
  if (!DEEP) return new Set();
  return new Set(DEEP.level_deltas.filter((d) => d.anomaly).map((d) => d.model_id));
}
const ANOMALOUS = anomalousModels();
function ranksPerLevel() {
  const ranks = {};
  for (const key of LEVEL_KEYS) {
    const scored = BOARD.filter((r) => r.levels[key] !== undefined)
      .sort((a, b) => b.levels[key] - a.levels[key]);
    scored.forEach((row, i) => { (ranks[row.model_id] ||= {})[key] = i + 1; });
  }
  return ranks;
}
const RANKS = ranksPerLevel();

/* ── State (single object; every control writes, every render reads) ── */
const state = {
  view: "heatmap", level: "all", families: new Set(FAMILIES),
  anomalyOnly: false, integrityOnly: false, metric: "reward",
  selection: [],
};
function visibleBoard() {
  return BOARD.filter((r) => {
    if (!state.families.has(familyOf(r.model_id))) return false;
    if (state.anomalyOnly && !ANOMALOUS.has(r.model_id) && r.model_id !== TARGET_ID) return false;
    if (state.integrityOnly) {
      const flagged = LEVEL_KEYS.some((k) => {
        const c = cellDeep(r.model_id, k);
        return c && c.integrity && c.integrity.contaminated;
      });
      if (!flagged) return false;
    }
    return true;
  });
}

/* ── Tooltip ── */
const tip = document.getElementById("tooltip");
function showTip(evt, title, subs) {
  tip.replaceChildren(el("div", { class: "t-title" }, title),
    ...subs.map((s) => el("div", { class: "t-sub" }, s)));
  tip.style.display = "block";
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + w > innerWidth - 8) x = evt.clientX - w - pad;
  if (y + h > innerHeight - 8) y = evt.clientY - h - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.display = "none"; }

/* ── Selection ── */
function toggleSelect(item) {
  const key = JSON.stringify(item);
  const idx = state.selection.findIndex((s) => JSON.stringify(s) === key);
  if (idx >= 0) state.selection.splice(idx, 1); else state.selection.push(item);
  updateAll();
}
function isSelected(item) {
  const key = JSON.stringify(item);
  return state.selection.some((s) => JSON.stringify(s) === key);
}

/* ── Header ── */
document.getElementById("meta").textContent =
  `target ${TARGET_ID} · matrix ${DIGEST.source_generated_at} · stats ${DIGEST.generated_at}`;
(function renderKpis() {
  const warnings = FINDINGS.filter((f) => f.severity === "warning").length;
  const kpis = [
    [String(BOARD.length), "models"],
    [String(LEVEL_KEYS.length), "levels"],
    [DIGEST.target_rank_combined === null ? "—" : "#" + DIGEST.target_rank_combined, "target rank"],
    [String(ANOMALOUS.size), "anomalous models"],
    [String(warnings), "warnings"],
  ];
  const box = document.getElementById("kpis");
  for (const [v, l] of kpis) {
    const tile = el("div", { class: "tile" });
    tile.append(el("div", { class: "v" }, v), el("div", { class: "l" }, l));
    box.appendChild(tile);
  }
})();

/* ── Controls ── */
function chipRow(containerId, options, isActive, onPick, { multi = false } = {}) {
  const box = document.getElementById(containerId);
  box.replaceChildren();
  for (const [key, label] of options) {
    const b = el("button", { class: "chip", "data-key": key, "aria-pressed": String(isActive(key)) }, label);
    b.addEventListener("click", () => { onPick(key); syncControls(); updateAll(); });
    box.appendChild(b);
  }
}
const VIEWS = [["heatmap", "Score heatmap"], ["bump", "Rank bump"], ["pareto", "Cost Pareto"], ["tasks", "Task health"]];
const METRICS = [["reward", "reward"], ["pass1", "pass@1"], ["passk", "pass@k"], ["cost", "cost"]];
const PRESETS = {
  "Anomalies": { view: "bump", anomalyOnly: true, integrityOnly: false, level: "all" },
  "Target vs field": { view: "heatmap", anomalyOnly: false, integrityOnly: false, metric: "reward" },
  "Task health": { view: "tasks", anomalyOnly: false, integrityOnly: false },
  "Full matrix": { view: "heatmap", anomalyOnly: false, integrityOnly: false, level: "all", metric: "reward" },
};
function applyPreset(name) {
  Object.assign(state, PRESETS[name]);
  state.families = new Set(FAMILIES);
}
function syncControls() {
  chipRow("presets", Object.keys(PRESETS).map((n) => [n, n]), () => false, (n) => applyPreset(n));
  chipRow("views", VIEWS, (k) => state.view === k, (k) => { state.view = k; });
  chipRow("levels", [["all", "All"], ...LEVEL_KEYS.map((k) => [k, "L" + k])],
    (k) => state.level === k, (k) => { state.level = k; });
  chipRow("families", FAMILIES.map((f) => [f, f]), (f) => state.families.has(f),
    (f) => { state.families.has(f) ? state.families.delete(f) : state.families.add(f); });
  chipRow("metrics", METRICS, (k) => state.metric === k, (k) => { state.metric = k; });
  document.getElementById("anomaly-only").checked = state.anomalyOnly;
  document.getElementById("integrity-only").checked = state.integrityOnly;
}
document.getElementById("anomaly-only").addEventListener("change", (e) => { state.anomalyOnly = e.target.checked; updateAll(); });
document.getElementById("integrity-only").addEventListener("change", (e) => { state.integrityOnly = e.target.checked; updateAll(); });

/* ── View 1: score heatmap (model × level, integrity ⚠ overlay) ── */
function metricValue(row, levelKey) {
  const deepCell = cellDeep(row.model_id, levelKey);
  if (state.metric === "reward") return row.levels[levelKey] ?? null;
  if (!deepCell) return null;
  if (state.metric === "pass1") return deepCell.pass_at_1;
  if (state.metric === "passk") return deepCell.pass_at_k;
  if (state.metric === "cost") return deepCell.cost_usd;
  return null;
}
function seqColor(v) {
  const idx = Math.min(SEQ.length - 1, Math.floor(v * SEQ.length));
  return { bg: SEQ[idx], ink: idx >= 3 ? "#ffffff" : "#0b0b0b" };
}
function renderHeatmap(box) {
  box.appendChild(el("h3", {}, `Score heatmap — ${METRICS.find(([k]) => k === state.metric)[1]}` +
    (DEEP ? " · ⚠ = integrity-contaminated cell" : "")));
  if (!DEEP) box.appendChild(el("div", { class: "note" }, "Deep stats unavailable — pass@k/cost metrics and integrity overlays need sweep_state.json."));
  const levels = state.level === "all" ? LEVEL_KEYS : [state.level];
  const table = el("table", { class: "heat" });
  const head = el("tr");
  head.appendChild(el("th"));
  for (const k of levels) head.appendChild(el("th", {}, "L" + k));
  table.appendChild(head);
  const costVals = [];
  if (state.metric === "cost") {
    for (const r of visibleBoard()) for (const k of levels) {
      const v = metricValue(r, k); if (v !== null && v !== undefined) costVals.push(v);
    }
  }
  const costMax = Math.max(...costVals, 0.0001);
  for (const row of visibleBoard()) {
    const tr = el("tr");
    const rowh = el("th", { class: "rowh" + (row.model_id === TARGET_ID ? " target" : "") + (isSelected({ type: "model", id: row.model_id }) ? " selected" : ""), title: row.name }, row.name + (row.model_id === TARGET_ID ? " ◎" : ""));
    rowh.addEventListener("click", () => toggleSelect({ type: "model", id: row.model_id }));
    tr.appendChild(rowh);
    for (const k of levels) {
      const v = metricValue(row, k);
      const deepCell = cellDeep(row.model_id, k);
      let td;
      if (v === null || v === undefined) {
        td = el("td", { class: "cell missing" }, "–");
      } else {
        const norm = state.metric === "cost" ? v / costMax : v;
        const { bg, ink } = seqColor(Math.max(0, Math.min(1, norm)));
        td = el("td", { class: "cell", style: `background:${bg};color:${ink}` },
          state.metric === "cost" ? "$" + v.toFixed(2) : Math.round(v * 100));
        if (deepCell && deepCell.integrity && deepCell.integrity.contaminated) {
          td.appendChild(el("span", { class: "flag" }, "⚠"));
        }
      }
      const sel = { type: "cell", id: row.model_id, level: k };
      if (isSelected(sel)) td.classList.add("selected");
      td.addEventListener("click", () => toggleSelect(sel));
      td.addEventListener("mousemove", (evt) => {
        const subs = [`L${k} reward ${pct(row.levels[k])}`];
        if (deepCell) {
          subs.push(`pass@1 ${pct(deepCell.pass_at_1)} · pass@k ${pct(deepCell.pass_at_k)} (gap ${pct(deepCell.pass_gap)})`);
          subs.push(`±CI ${deepCell.ci95 === null ? "—" : pct(deepCell.ci95)} · cost ${deepCell.cost_usd === null ? "unmeasured" : "$" + deepCell.cost_usd.toFixed(4)}`);
          if (deepCell.integrity && deepCell.integrity.contaminated) subs.push("⚠ " + deepCell.integrity.reasons.join(", "));
        }
        showTip(evt, row.name, subs);
      });
      td.addEventListener("mouseleave", hideTip);
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
  box.appendChild(table);
}

/* ── View 2: rank bump chart (the anomaly visual) ── */
function renderBump(box) {
  box.appendChild(el("h3", {}, `Rank bump L${LEVEL_KEYS[0]}→L${LEVEL_KEYS[LEVEL_KEYS.length - 1]} — crossings = level-dependent skill`));
  const rows = visibleBoard().filter((r) => Object.keys(RANKS[r.model_id] || {}).length >= 2);
  if (!rows.length) { box.appendChild(el("div", { class: "note" }, "No models match the current filters.")); return; }
  const W = 760, H = Math.max(300, rows.length * 18 + 60), padL = 60, padR = 190, padT = 26, padB = 20;
  const svg = svgEl("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img" });
  const maxRank = Math.max(...rows.map((r) => Math.max(...Object.values(RANKS[r.model_id]))));
  const x = (i) => padL + i * (W - padL - padR) / Math.max(1, LEVEL_KEYS.length - 1);
  const y = (rank) => padT + (rank - 1) * (H - padT - padB) / Math.max(1, maxRank - 1);
  LEVEL_KEYS.forEach((k, i) => {
    svg.appendChild(svgEl("line", { class: "grid", x1: x(i), y1: padT, x2: x(i), y2: H - padB }));
    svg.appendChild(svgEl("text", { x: x(i), y: 14, "text-anchor": "middle" }, "L" + k));
  });
  for (const row of rows) {
    const ranks = RANKS[row.model_id];
    const pts = LEVEL_KEYS.filter((k) => ranks[k]).map((k, _, arr) => `${x(LEVEL_KEYS.indexOf(k))},${y(ranks[k])}`);
    const isTarget = row.model_id === TARGET_ID;
    const cls = "line" + (isTarget ? " target" : "") + (ANOMALOUS.has(row.model_id) ? " anomalous" : "") + (isSelected({ type: "model", id: row.model_id }) ? " selected" : "");
    const line = svgEl("polyline", { class: cls, points: pts.join(" ") });
    line.addEventListener("click", () => toggleSelect({ type: "model", id: row.model_id }));
    line.addEventListener("mousemove", (evt) => showTip(evt, row.name,
      LEVEL_KEYS.filter((k) => ranks[k]).map((k) => `L${k}: rank ${ranks[k]} (${pct(row.levels[k])})`)));
    line.addEventListener("mouseleave", hideTip);
    svg.appendChild(line);
    // Selective direct labels: target + anomalous models only (dataviz rule).
    if (isTarget || ANOMALOUS.has(row.model_id)) {
      const lastKey = LEVEL_KEYS.filter((k) => ranks[k]).at(-1);
      const lbl = svgEl("text", { class: "lbl" + (isTarget ? " target" : ""), x: x(LEVEL_KEYS.indexOf(lastKey)) + 8, y: y(ranks[lastKey]) + 4 }, row.name + (isTarget ? " ◎" : ""));
      lbl.addEventListener("click", () => toggleSelect({ type: "model", id: row.model_id }));
      svg.appendChild(lbl);
    }
  }
  box.appendChild(svg);
  box.appendChild(el("div", { class: "note" }, `Amber lines cross the ±${ANOMALY_PP}pp anomaly threshold between levels; blue is the target.`));
}

/* ── View 3: score-vs-cost Pareto (measured cells only) ── */
function renderPareto(box) {
  box.appendChild(el("h3", {}, "Score vs cost — measured models only; ring = Pareto frontier"));
  const points = DEEP ? DEEP.cost.pareto.filter((p) => state.families.has(familyOf(p.model_id))) : [];
  if (!points.length) {
    box.appendChild(el("div", { class: "note" }, DEEP
      ? "No measured-cost models match the filters. Prime-hosted cells record cost 0.0 = unmeasured, not free."
      : "Deep stats unavailable — the Pareto view needs sweep_state.json costs."));
    return;
  }
  const W = 720, H = 380, padL = 56, padR = 30, padT = 16, padB = 42;
  const svg = svgEl("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img" });
  const maxCost = Math.max(...points.map((p) => p.cost_usd)) * 1.1;
  const x = (c) => padL + c / maxCost * (W - padL - padR);
  const y = (s) => H - padB - s * (H - padT - padB);
  for (const frac of [0, 0.25, 0.5, 0.75, 1]) {
    svg.appendChild(svgEl("line", { class: "grid", x1: padL, y1: y(frac), x2: W - padR, y2: y(frac) }));
    svg.appendChild(svgEl("text", { x: padL - 8, y: y(frac) + 4, "text-anchor": "end" }, (frac * 100) + "%"));
  }
  svg.appendChild(svgEl("line", { class: "axis", x1: padL, y1: H - padB, x2: W - padR, y2: H - padB }));
  svg.appendChild(svgEl("text", { x: (padL + W - padR) / 2, y: H - 10, "text-anchor": "middle" }, "total measured cost (USD)"));
  svg.appendChild(svgEl("text", { x: W - padR, y: H - padB + 16, "text-anchor": "end" }, "$" + maxCost.toFixed(2)));
  for (const p of points) {
    const isTarget = p.model_id === TARGET_ID;
    const cls = "pt" + (isTarget ? " target" : "") + (p.frontier ? " frontier" : "") + (isSelected({ type: "model", id: p.model_id }) ? " selected" : "");
    const dot = svgEl("circle", { class: cls, cx: x(p.cost_usd), cy: y(p.score), r: isTarget ? 7 : 5 });
    dot.addEventListener("click", () => toggleSelect({ type: "model", id: p.model_id }));
    dot.addEventListener("mousemove", (evt) => showTip(evt, p.model,
      [`mean overall ${pct(p.score)} · $${p.cost_usd.toFixed(4)}`, p.frontier ? "on the Pareto frontier" : "dominated"]));
    dot.addEventListener("mouseleave", hideTip);
    svg.appendChild(dot);
    if (p.frontier || isTarget) {
      svg.appendChild(svgEl("text", { class: "lbl" + (isTarget ? " target" : ""), x: x(p.cost_usd) + 9, y: y(p.score) + 4 }, p.model));
    }
  }
  box.appendChild(svg);
}

/* ── View 4: task discrimination panel ── */
function renderTasks(box) {
  const levels = state.level === "all" ? LEVEL_KEYS : [state.level];
  for (const key of levels) {
    const level = DIGEST.levels[key];
    box.appendChild(el("h3", {}, `L${key} task health — solve rate, discrimination, misconceptions`));
    for (const task of [...level.tasks].sort((a, b) => (a.mean_score ?? 2) - (b.mean_score ?? 2))) {
      const row = el("div", { class: "bar-row" + (isSelected({ type: "task", id: task.name, level: key }) ? " selected" : "") });
      const dead = (level.universal_easy_tasks.includes(task.name) || (level.universal_fail_tasks || []).includes(task.name));
      row.appendChild(el("span", { class: "task-label" }, task.name + (dead ? " 💀" : "")));
      const track = el("div", { class: "bar-track" });
      const fill = el("div", { class: "bar-fill" });
      fill.style.width = ((task.mean_score ?? 0) * 100) + "%";
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el("span", { class: "v" }, `${pct(task.mean_score)} · d ${task.discrimination ?? "—"}`));
      row.addEventListener("click", () => toggleSelect({ type: "task", id: task.name, level: key }));
      row.addEventListener("mousemove", (evt) => showTip(evt, task.name, [
        `expected: ${task.expected}`,
        `mean ${pct(task.mean_score)} over ${task.n_scored} models · consensus ${task.consensus === null ? "—" : pct(task.consensus)}`,
        `solved by: ${task.solved_by.join(", ") || "no model"}`,
      ]));
      row.addEventListener("mouseleave", hideTip);
      box.appendChild(row);
    }
    const modes = DEEP && DEEP.wrong_answer_modes[key];
    if (modes && Object.keys(modes).length) {
      const table = el("table", { class: "mini" });
      const head = el("tr");
      ["Task", "Most common wrong answer", "Count"].forEach((h) => head.appendChild(el("th", {}, h)));
      table.appendChild(head);
      for (const [taskId, mode] of Object.entries(modes)) {
        const tr = el("tr");
        tr.append(el("td", {}, taskId), el("td", {}, mode.answer), el("td", { class: "num" }, String(mode.count)));
        table.appendChild(tr);
      }
      box.appendChild(el("div", { class: "note" }, "Shared misconceptions (same wrong answer across models):"));
      box.appendChild(table);
    }
  }
}

/* ── Prompt output (natural language, only non-default state) ── */
function describeSelection(item) {
  if (item.type === "model") {
    const row = BOARD.find((r) => r.model_id === item.id);
    if (!row) return item.id;
    const bits = LEVEL_KEYS.filter((k) => row.levels[k] !== undefined).map((k) => `L${k} ${pct(row.levels[k])}`);
    const flags = LEVEL_KEYS.map((k) => cellDeep(item.id, k))
      .filter((c) => c && c.integrity && c.integrity.contaminated).length;
    return `${row.name} (${bits.join(", ")}${flags ? `; ${flags} integrity-flagged cell(s)` : ""})`;
  }
  if (item.type === "cell") {
    const row = BOARD.find((r) => r.model_id === item.id);
    const c = cellDeep(item.id, item.level);
    const integrity = c && c.integrity && c.integrity.contaminated ? ` — ⚠ ${c.integrity.reasons.join(", ")}` : "";
    return `${row ? row.name : item.id} on L${item.level} (${pct(row ? row.levels[item.level] : null)}${integrity})`;
  }
  const task = DIGEST.levels[item.level].tasks.find((t) => t.name === item.id);
  const mode = DEEP && DEEP.wrong_answer_modes[item.level] && DEEP.wrong_answer_modes[item.level][item.id];
  return `task ${item.id} on L${item.level} (mean ${pct(task ? task.mean_score : null)}${mode ? `; common wrong answer "${mode.answer}" ×${mode.count}` : ""})`;
}
function updatePrompt() {
  const target = BOARD.find((r) => r.model_id === TARGET_ID);
  const parts = [
    `Investigate the py-bug-trace sweep (${BOARD.length} models × ${LEVEL_KEYS.length} levels; ` +
    `target ${target ? target.name : TARGET_ID} at combined rank ${DIGEST.target_rank_combined ?? "—"}).`,
  ];
  const viewLabel = VIEWS.find(([k]) => k === state.view)[1].toLowerCase();
  const scope = [];
  if (state.level !== "all") scope.push(`focused on L${state.level}`);
  if (state.families.size !== FAMILIES.length) scope.push(`limited to the ${[...state.families].join(", ")} families`);
  if (state.anomalyOnly) scope.push(`showing only models with level deltas beyond ±${ANOMALY_PP}pp`);
  if (state.integrityOnly) scope.push("showing only integrity-flagged models");
  parts.push(`I was looking at the ${viewLabel} view${scope.length ? " " + scope.join(", ") : ""}.`);
  if (state.selection.length) {
    parts.push("Dig into: " + state.selection.map(describeSelection).join("; ") + ".");
    parts.push("Explain the most likely causes using the per-task rollouts, and suggest which sweep cells to rerun or which tasks to redesign.");
  } else {
    parts.push("Summarize the most impactful anomalies and data-quality risks, and suggest next sweep actions.");
  }
  document.getElementById("prompt-output").textContent = parts.join(" ");
}
document.getElementById("copy-btn").addEventListener("click", async () => {
  const btn = document.getElementById("copy-btn");
  try {
    await navigator.clipboard.writeText(document.getElementById("prompt-output").textContent);
    btn.textContent = "Copied!";
  } catch {
    btn.textContent = "Copy failed";
  }
  setTimeout(() => { btn.textContent = "Copy prompt"; }, 1200);
});

/* ── Render loop ── */
const RENDERERS = { heatmap: renderHeatmap, bump: renderBump, pareto: renderPareto, tasks: renderTasks };
function renderPreview() {
  const box = document.getElementById("preview");
  box.replaceChildren();
  RENDERERS[state.view](box);
}
function updateAll() { renderPreview(); updatePrompt(); }
applyPreset("Anomalies");   // highest-impact view first (inverted pyramid)
syncControls();
updateAll();
</script>
<script src="archive-chrome.js"></script>
</body>
